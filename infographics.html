<style>

.zukai-card.is-highlighted {

<script src="assets/js/cta-tracking.js"></script>
<script>
(function() {
  'use strict';

  const data = window.ManabiMapData || {};
  const parts = Array.isArray(data.parts) ? data.parts : [];
  const podcasts = Array.isArray(data.mediaItems)
    ? data.mediaItems.filter(function(item) { return item.type === 'podcast'; })
    : [];
  const colorMap = {
    orange: '#ff6b2b',
    blue: '#4aa3ff',
    cyan: '#00d4ff',
    green: '#39ff39',
    purple: '#bf5fff',
    gold: '#ffd700',
    magenta: '#ff2fa3',
    sky: '#00d4ff'
  };

  const groupsEl = document.getElementById('zukai-groups');
  const countEl = document.getElementById('zukai-count');
  const filterButtons = document.getElementById('filter-buttons');
  const modal = document.getElementById('zukai-modal');
  const modalImage = document.getElementById('zukai-modal-image');
  const modalTitle = document.getElementById('zukai-modal-title');
  const modalCaption = document.getElementById('zukai-modal-caption');
  const modalDownload = document.getElementById('zukai-modal-download');
  let activePart = 'all';

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
    });
  }

  function findPart(partId) {
    return parts.find(function(part) { return part.id === partId; }) || null;
  }

  function firstPartId(item) {
    const related = Array.isArray(item.relatedParts) ? item.relatedParts : [];
    return related.find(function(id) { return /^part/.test(id); }) || '';
  }

  function displayPartNumber(part) {
    return part && part.number ? String(part.number).replace(/^0/, '') : '';
  }

  function slugFor(src) {
    const path = String(src || '').split('?')[0];
    const file = path.split('/').pop() || '';
    return file.replace(/\.[a-z0-9]+$/i, '');
  }

  function fileNameFor(src) {
    const path = String(src || '').split('?')[0];
    const segments = path.split('/');
    return segments[segments.length - 1] || 'infographic.png';
  }

  const figures = [];
  podcasts.forEach(function(podcast) {
    const partId = firstPartId(podcast);
    (Array.isArray(podcast.infographics) ? podcast.infographics : []).forEach(function(infographic) {
      if (!infographic || !infographic.src) return;
      figures.push({
        slug: slugFor(infographic.src),
        src: infographic.src,
        title: infographic.title || '図解',
        caption: infographic.caption || '',
        partId: partId,
        podcast: podcast
      });
    });
  });

  function figurePartIds() {
    return figures
      .map(function(figure) { return figure.partId; })
      .filter(Boolean)
      .filter(function(id, index, array) { return array.indexOf(id) === index; });
  }

  function figureCountForPart(partId) {
    return figures.filter(function(figure) { return figure.partId === partId; }).length;
  }

  function hashTarget() {
    const hash = decodeURIComponent((window.location.hash || '').replace('#', ''))
      .replace('part8_2', 'part8-2');
    if (!hash) return null;
    if (figurePartIds().indexOf(hash) !== -1) return { part: hash };
    const figure = figures.find(function(item) { return item.slug === hash; });
    if (figure) return { part: figure.partId, slug: figure.slug };
    return null;
  }

  function setActivePart(partId, updateHash) {
    activePart = partId || 'all';
    filterButtons.querySelectorAll('.filter-button').forEach(function(item) {
      item.classList.toggle('active', (item.dataset.part || 'all') === activePart);
    });
    if (updateHash && window.history && window.history.replaceState) {
      window.history.replaceState(null, '', activePart === 'all'
        ? window.location.pathname + window.location.search
        : '#' + activePart);
    }
    renderGroups();
  }

  function renderFilters() {
    const partIds = figurePartIds();
    const buttons = [
      '<button type="button" class="filter-button active" data-part="all">すべて (' + figures.length + ')</button>'
    ].concat(partIds.map(function(partId) {
      const part = findPart(partId);
      const label = part ? '第' + displayPartNumber(part) + '部' : partId;
      return '<button type="button" class="filter-button" data-part="' + escapeHtml(partId) + '">' + escapeHtml(label) + ' (' + figureCountForPart(partId) + ')</button>';
    }));
    filterButtons.innerHTML = buttons.join('');
    filterButtons.querySelectorAll('.filter-button').forEach(function(button) {
      button.addEventListener('click', function() {
        setActivePart(button.dataset.part || 'all', true);
      });
    });
  }

  function cardHtml(figure) {
    const part = findPart(figure.partId);
    const accent = part && colorMap[part.color] ? colorMap[part.color] : '#8da2ff';
    return [
      '<article class="zukai-card" id="' + escapeHtml(figure.slug) + '" style="--accent:' + escapeHtml(accent) + '">',
        '<button type="button" class="zukai-card__figure" data-zukai-open="' + escapeHtml(figure.slug) + '" aria-label="' + escapeHtml(figure.title) + 'を拡大">',
          '<img src="' + escapeHtml(figure.src) + '" alt="' + escapeHtml(figure.title) + '" loading="lazy">',
          '<span class="zukai-card__zoom">拡大</span>',
        '</button>',
        '<div class="zukai-card__body">',
          '<div class="zukai-card__title">' + escapeHtml(figure.title) + '</div>',
          figure.caption ? '<div class="zukai-card__caption">' + escapeHtml(figure.caption) + '</div>' : '',
          '<div class="zukai-card__actions">',
            '<button type="button" class="zukai-card__action" data-zukai-open="' + escapeHtml(figure.slug) + '">拡大して見る</button>',
            '<a class="zukai-card__action" href="' + escapeHtml(figure.src) + '" download="' + escapeHtml(fileNameFor(figure.src)) + '">保存</a>',
            figure.podcast && figure.podcast.url
              ? '<a class="zukai-card__action zukai-card__action--podcast" href="' + escapeHtml(figure.podcast.url) + '" target="_blank" rel="noopener noreferrer" data-track-event="infographic_to_podcast_click" data-track-source="infographics" data-track-content-id="' + escapeHtml(figure.slug) + '" data-track-destination-type="podcast" data-track-destination-id="' + escapeHtml(figure.podcast.id) + '">このPodcastを聴く</a>'
              : '',
          '</div>',
        '</div>',
      '</article>'
    ].join('');
  }

  function renderGroups() {
    const visible = activePart === 'all'
      ? figures
      : figures.filter(function(figure) { return figure.partId === activePart; });

    countEl.textContent = figures.length + (figures.length === 1 ? ' figure' : ' figures');

    if (!visible.length) {
      groupsEl.innerHTML = '<div class="empty">図解は準備中です。</div>';
      return;
    }

    const groupOrder = [];
    const grouped = {};
    visible.forEach(function(figure) {
      const partId = figure.partId || 'other';
      if (!grouped[partId]) {
        grouped[partId] = [];
        groupOrder.push(partId);
      }
      grouped[partId].push(figure);
    });

    groupsEl.innerHTML = groupOrder.map(function(partId) {
      const part = findPart(partId);
      const accent = part && colorMap[part.color] ? colorMap[part.color] : '#8da2ff';
      const groupFigures = grouped[partId];
      const headHtml = part
        ? [
            '<div class="zukai-group__head" id="' + escapeHtml(partId) + '" style="--accent:' + escapeHtml(accent) + '">',
              '<span class="zukai-group__part">PART ' + escapeHtml(displayPartNumber(part)) + '</span>',
              '<span class="zukai-group__title">' + escapeHtml(part.title) + '</span>',
              '<span class="zukai-group__count">' + groupFigures.length + (groupFigures.length === 1 ? ' figure' : ' figures') + '</span>',
              '<a class="zukai-group__map-link" href="' + escapeHtml(part.pageUrl || 'index.html#map-base') + '">この部の地図へ</a>',
            '</div>'
          ].join('')
        : '';
      return [
        '<section class="zukai-group" aria-label="' + escapeHtml(part ? '第' + displayPartNumber(part) + '部の図解' : '図解') + '">',
          headHtml,
          '<div class="zukai-grid">',
          groupFigures.map(cardHtml).join(''),
          '</div>',
        '</section>'
      ].join('');
    }).join('');
    bindCards();
  }

  function openModal(slug) {
    const figure = figures.find(function(item) { return item.slug === slug; });
    if (!figure || !modal) return;
    modalImage.src = figure.src;
    modalImage.alt = figure.title;
    modalTitle.textContent = figure.title;
    modalCaption.textContent = figure.caption;
    modalDownload.href = figure.src;
    modalDownload.setAttribute('download', fileNameFor(figure.src));
    modal.hidden = false;
    document.body.classList.add('modal-open');
  }

  function closeModal() {
    if (!modal) return;
    modal.hidden = true;
    modalImage.src = '';
    modalDownload.href = '#';
    document.body.classList.remove('modal-open');
  }

  function bindCards() {
    groupsEl.querySelectorAll('[data-zukai-open]').forEach(function(button) {
      button.addEventListener('click', function() {
        openModal(button.dataset.zukaiOpen || '');
      });
    });
  }

  if (modal) {
    modal.addEventListener('click', function(event) {
      if (event.target === modal) closeModal();
    });
  }
  document.querySelectorAll('[data-zukai-close]').forEach(function(button) {
    button.addEventListener('click', closeModal);
  });
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') closeModal();
  });

  renderFilters();
  const target = hashTarget();
  setActivePart(target ? target.part : 'all', false);
  if (target) {
    const focusEl = document.getElementById(target.slug || target.part);
    if (focusEl) {
      focusEl.scrollIntoView();
      if (target.slug) focusEl.classList.add('is-highlighted');
    }
  }
  window.addEventListener('hashchange', function() {
    const next = hashTarget();
    if (next) setActivePart(next.part, false);
  });
})();
</script>
<script src="assets/js/footprints.js"></script>
<script src="assets/js/sky-clock.js"></script>
</body>
</html>

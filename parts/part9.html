<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハルとおじいさん｜第9部 身体という時間</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0d10;
  --panel: #141619;
  --text: #eef2ea;
  --muted: #a7afa4;
  --line: rgba(255,255,255,0.12);
  --accent: #ffb86b;
  --green: #95d88f;
  --blue: #8da2ff;
}
body {
  min-height: 100vh;
  font-family: 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(149,216,143,0.16), transparent 30%),
    radial-gradient(circle at 85% 8%, rgba(255,184,107,0.18), transparent 32%),
    linear-gradient(180deg, #101316, var(--bg));
  color: var(--text);
  line-height: 1.85;
}
a { color: inherit; text-decoration: none; }
.nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(11,13,16,0.9);
  backdrop-filter: blur(12px);
}
.nav a {
  flex: 0 0 auto;
  padding: 13px 14px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.nav a.active { color: var(--accent); }
.hero {
  max-width: 1120px;
  margin: 0 auto;
  padding: 86px 24px 44px;
}
.eyebrow {
  margin-bottom: 14px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.36em;
}
h1 {
  max-width: 980px;
  font-size: clamp(38px, 7vw, 82px);
  line-height: 1.12;
  letter-spacing: 0.04em;
}
.lead {
  max-width: 740px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 15px;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 30px;
}
.btn {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid rgba(255,184,107,0.42);
  border-radius: 8px;
  background: rgba(255,184,107,0.09);
  color: #ffe0ba;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
}
.section {
  max-width: 1120px;
  margin: 0 auto;
  padding: 26px 24px 58px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: end;
  margin-bottom: 18px;
}
.section-label {
  color: var(--accent);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.28em;
}
.section-title {
  margin-top: 4px;
  font-size: 28px;
  line-height: 1.35;
}
.count {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}
.card {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(20,22,25,0.76);
}
.thumb {
  display: block;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #050608;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px;
  flex: 1;
}
.meta {
  color: var(--accent);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.16em;
}
.title {
  font-size: 17px;
  line-height: 1.55;
}
.question {
  color: var(--muted);
  font-size: 12px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
}
.action {
  min-height: 32px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
}
.action.primary {
  border-color: rgba(255,184,107,0.45);
  color: #ffe0ba;
}
.note-card .meta { color: var(--green); }
.note-card .action.primary {
  border-color: rgba(149,216,143,0.45);
  color: #d9ffd5;
}
.empty {
  padding: 28px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--muted);
}
@media (max-width: 720px) {
  .section-head { display: block; }
  .count { display: block; margin-top: 6px; }
}
</style>
</head>
<body>
<nav class="nav">
  <a href="../index.html">学びの地図</a>
  <a href="part8_2.html">第8部</a>
  <a href="part9.html" class="active">第9部</a>
  <a href="../podcast.html">Podcast</a>
  <a href="../note.html">note</a>
</nav>

<main>
  <section class="hero">
    <div class="eyebrow">PART 09</div>
    <h1>身体という時間</h1>
    <p class="lead">
      二足歩行、手と道具、脳、報酬系、不安、集中、痛み、感性。
      第9部は、旧石器時代から残る身体の設計を手がかりに、生成AI時代の生き方を考える章です。
    </p>
    <div class="hero-actions">
      <a class="btn" href="../podcast.html">Podcast一覧へ</a>
      <a class="btn" href="../note.html">note記事へ</a>
    </div>
  </section>

  <section class="section" aria-label="第9部Podcast">
    <div class="section-head">
      <div>
        <div class="section-label">PODCAST</div>
        <h2 class="section-title">耳でたどる第9部</h2>
      </div>
      <div class="count" id="podcast-count">0 episodes</div>
    </div>
    <div class="grid" id="podcast-grid"></div>
  </section>

  <section class="section" aria-label="第9部note">
    <div class="section-head">
      <div>
        <div class="section-label">NOTE</div>
        <h2 class="section-title">文章で深める枝道</h2>
      </div>
      <div class="count" id="note-count">0 notes</div>
    </div>
    <div class="grid" id="note-grid"></div>
  </section>
</main>

<script src="../assets/js/manabimap-data.js"></script>
<script>
(function() {
  'use strict';
  const data = window.ManabiMapData || {};
  const podcasts = data.mediaForPart ? data.mediaForPart('part9', 'podcast') : [];
  const notes = data.notesForPart ? data.notesForPart('part9') : [];

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function(char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
    });
  }

  function youtubeId(url) {
    try {
      const parsed = new URL(url);
      if (parsed.hostname === 'youtu.be') return parsed.pathname.replace('/', '');
      return parsed.searchParams.get('v') || '';
    } catch (error) {
      return '';
    }
  }

  function thumb(url) {
    const id = youtubeId(url);
    return id ? 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg' : '';
  }

  function podcastCard(item, index) {
    const image = thumb(item.url);
    return [
      '<article class="card">',
        image ? '<a class="thumb" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(image) + '" alt="' + escapeHtml(item.title) + ' サムネイル" loading="lazy"></a>' : '',
        '<div class="body">',
          '<div class="meta">EPISODE ' + String(index + 1).padStart(2, '0') + '</div>',
          '<h3 class="title">' + escapeHtml(item.title) + '</h3>',
          '<p class="question">問：' + escapeHtml(item.question || '') + '</p>',
          '<div class="actions"><a class="action primary" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">聴く</a></div>',
        '</div>',
      '</article>'
    ].join('');
  }

  function noteCard(note) {
    const href = note.url || '../note.html#note-card-' + note.number;
    const label = note.url ? '読む' : '準備中';
    return [
      '<article class="card note-card">',
        '<div class="body">',
          '<div class="meta">NOTE #' + String(note.number).padStart(2, '0') + '</div>',
          '<h3 class="title">' + escapeHtml(note.title) + '</h3>',
          '<p class="question">' + escapeHtml(note.excerpt || '') + '</p>',
          '<div class="actions"><a class="action primary" href="' + escapeHtml(href) + '"' + (note.url ? ' target="_blank" rel="noopener"' : '') + '>' + label + '</a></div>',
        '</div>',
      '</article>'
    ].join('');
  }

  document.getElementById('podcast-count').textContent = podcasts.length + ' episodes';
  document.getElementById('note-count').textContent = notes.length + ' notes';
  document.getElementById('podcast-grid').innerHTML = podcasts.length ? podcasts.map(podcastCard).join('') : '<div class="empty">Podcastは準備中です。</div>';
  document.getElementById('note-grid').innerHTML = notes.length ? notes.map(noteCard).join('') : '<div class="empty">note記事は準備中です。</div>';
})();
</script>
</body>
</html>
